name: Production build

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      
      - name: Install Ant, gh CLI and Saxon
        run: |
          sudo apt-get update
          sudo apt-get install -y ant gh curl
          mkdir -p scripts/libs
          curl -L https://github.com/Saxonica/Saxon-HE/releases/download/SaxonHE12-9/SaxonHE12-9J.zip -o saxon.zip
          unzip saxon.zip
          mv saxon-he-12.9.jar scripts/libs/
          mv lib scripts/libs/
          rm saxon.zip

      - name: Build software
        run: |
          ant -verbose -lib scripts/libs -Dproject.status=development dist
          echo "Build finished, listing dist:"
          ls -la dist || true

      - name: Find artifact
        id: find
        run: |
          ART=$(ls dist/baudiApp-*.xar 2>/dev/null | head -n1 || true)
          if [ -z "$ART" ]; then echo "No artifact found in dist" && exit 1; fi
          echo "artifact=$ART" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename $ART)" >> $GITHUB_OUTPUT

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: portal-app-prod
          path: dist/baudiApp-*.xar
          retention-days: 90

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^project.version=' build.properties | cut -d'=' -f2)
          gh release create v$VERSION \
            --title "v$VERSION" \
            --generate-notes \
            --target main \
            ${{ steps.find.outputs.artifact }}

      - name: Update prod-latest tag
        continue-on-error: true
        run: |
          git push --delete origin prod-latest || echo "Tag prod-latest does not exist yet"
          git tag -f prod-latest
          git push origin prod-latest

  dispatch:
    runs-on: ubuntu-latest
    needs: build-publish
    steps:
      - name: Trigger baudi-docker (Dev) build
        env:
          PAT: ${{ secrets.BAUDI_WORKFLOW_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: token $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Baumann-Digital/baudi-docker/dispatches \
            -d '{"event_type":"portal_app_prod_latest","client_payload":{"ref":"'$GITHUB_REF'","commit":"'$GITHUB_SHA'"}}'