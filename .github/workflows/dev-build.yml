name: Develop build

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Ant, gh CLI and Saxon
        run: |
          sudo apt-get update
          sudo apt-get install -y ant gh curl
          mkdir -p scripts/libs
          curl -L https://github.com/Saxonica/Saxon-HE/releases/download/SaxonHE12-9/SaxonHE12-9J.zip -o saxon.zip
          unzip saxon.zip
          mv saxon-he-12.9.jar scripts/libs/
          mv lib scripts/libs/
          rm saxon.zip

      - name: Build software
        run: |
          ant -verbose -lib scripts/libs -Dproject.status=development dist
          echo "Build finished, listing dist:"
          ls -la dist || true

      - name: Find artifact
        id: find
        run: |
          ART=$(ls dist/baudiApp-*.xar 2>/dev/null | head -n1 || true)
          if [ -z "$ART" ]; then echo "No artifact found in dist" && exit 1; fi
          echo "artifact=$ART" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename $ART)" >> $GITHUB_OUTPUT

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: portal-app-dev
          path: dist/baudiApp-*.xar
          retention-days: 90

      - name: Delete existing dev-latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes || echo "Release dev-latest does not exist yet"
          git push origin :refs/tags/dev-latest || echo "Tag dev-latest does not exist yet"

      - name: Create or update dev-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create dev-latest \
            --title "BauDi Portal-App (dev-latest)" \
            --notes "Automatischer Build vom develop Branch. Dies ist ein Pre-Release für Entwicklungszwecke." \
            --prerelease \
            --target develop \
            ${{ steps.find.outputs.artifact }}

      - name: Trigger baudi-docker build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/Baumann-Digital/baudi-docker/dispatches \
            -X POST \
            -f event_type=portal_app_dev_latest