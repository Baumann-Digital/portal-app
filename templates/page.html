<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta charset="utf-8"/>
		<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
		<title data-template="config:app-title">Baumann-Digital</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<link rel="shortcut icon" href="/icon.png"/>
		
		<!-- Bootstrap core CSS -->
		<link rel="stylesheet" href="$resources/lib/bootstrap/dist/css/bootstrap.min.css"/>
		
		<!-- Bootstrap theme -->
		<!--        <link href="$resources/css/bootstrap-theme.min.css" rel="stylesheet"/>-->
		
		<!-- font awesome -->
		<link rel="stylesheet" href="$resources/css/font-awesome.min.css"/>
		
		<!-- sticky-footer -->
		<link href="$resources/css/sticky-footer-navbar.css" rel="stylesheet"/>
		
		<!-- Custom styles for this template -->
		<link href="$resources/css/theme.css" rel="stylesheet"/>
		<link href="$resources/css/document.css" rel="stylesheet"/>
		
		<!-- Override Bootstrap colors with green theme -->
		<style>
			:root {
				--primary: rgba(0, 174, 0, 0.9) !important;
				--yellow: rgba(0, 174, 0, 0.9) !important;
				--warning: rgba(0, 174, 0, 0.9) !important;
			}
			
			/* Main Navigation - Landing Page Style */
			#mainNav {
				padding-top: 1rem;
				padding-bottom: 1rem;
				background-color: #212529 !important;
			}
			#mainNav .navbar-toggler {
				padding: 0.75rem;
				font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				font-size: 0.75rem;
				color: #fff;
				text-transform: uppercase;
				background-color: rgba(0, 174, 0, 0.9);
				border: 0;
			}
			#mainNav .navbar-brand {
				color: rgba(0, 174, 0, 0.9) !important;
				font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				font-weight: 700;
				letter-spacing: 0.0625em;
				text-transform: uppercase;
			}
			#mainNav .navbar-brand img {
				height: 1.5rem;
			}
			#mainNav .navbar-nav .nav-item .nav-link {
				font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				font-size: 0.95rem;
				color: #fff !important;
				letter-spacing: 0.0625em;
			}
			#mainNav .navbar-nav .nav-item .nav-link.active,
			#mainNav .navbar-nav .nav-item .nav-link:hover {
				color: rgba(0, 174, 0, 0.9) !important;
			}
			#mainNav .dropdown-menu {
				background-color: #212529;
			}
			#mainNav .dropdown-menu .nav-link {
				color: #fff !important;
			}
			#mainNav .dropdown-menu .nav-link:hover {
				color: rgba(0, 174, 0, 0.9) !important;
				background-color: rgba(0, 174, 0, 0.1);
			}
			
			/* Primary buttons - green background */
			.btn-primary {
				background-color: rgba(0, 174, 0, 0.9) !important;
				border-color: rgba(0, 174, 0, 0.9) !important;
			}
			.btn-primary:hover,
			.btn-primary:focus,
			.btn-primary:active,
			.btn-primary:not(:disabled):not(.disabled):active,
			.btn-primary:not(:disabled):not(.disabled).active,
			.show > .btn-primary.dropdown-toggle {
				background-color: rgba(0, 150, 0, 0.9) !important;
				border-color: rgba(0, 150, 0, 0.9) !important;
			}
			.btn-primary.focus,
			.btn-primary:focus,
			.btn-primary:not(:disabled):not(.disabled):active:focus,
			.btn-primary:not(:disabled):not(.disabled).active:focus,
			.show > .btn-primary.dropdown-toggle:focus {
				box-shadow: 0 0 0 0.2rem rgba(0, 174, 0, 0.25) !important;
			}
			
			/* Custom controls - green */
			.custom-control-input:checked ~ .custom-control-label::before {
				background-color: rgba(0, 174, 0, 0.9) !important;
				border-color: rgba(0, 174, 0, 0.9) !important;
			}
			.custom-control-input:focus ~ .custom-control-label::before {
				box-shadow: 0 0 0 0.2rem rgba(0, 174, 0, 0.25) !important;
			}
			.custom-control-input:focus:not(:checked) ~ .custom-control-label::before {
				border-color: rgba(0, 174, 0, 0.9) !important;
			}
			.custom-control-input:not(:disabled):active ~ .custom-control-label::before {
				background-color: rgba(0, 174, 0, 0.3) !important;
				border-color: rgba(0, 174, 0, 0.9) !important;
			}
			
			/* Nav-Tabs (Register-Seiten) - Grau mit weißer Schrift wenn aktiv */
			[role="tablist"] .nav-link {
				color: rgba(0, 174, 0, 0.9) !important;
				border-color: rgba(0, 174, 0, 0.9);
			}
			[role="tablist"] .nav-link:hover {
				color: rgba(0, 150, 0, 0.9) !important;
				border-color: rgba(0, 150, 0, 0.9);
			}
			[role="tablist"] .nav-link.active {
				background-color: #212529 !important;
				color: white !important;
				border-color: #212529 !important;
			}
			[role="tablist"] .nav-link.active:hover {
				background-color: #1a1d20 !important;
				color: white !important;
				border-color: #1a1d20 !important;
			}
			
			/* Links (außerhalb der Navigation) */
			main a:not(.nav-link):not(.btn) {
				color: rgba(0, 174, 0, 0.9) !important;
			}
			main a:not(.nav-link):not(.btn):hover {
				color: rgba(0, 150, 0, 0.9) !important;
			}
		</style>
		<!-- <script src="https://code.jquery.com/jquery-3.1.1.min.js" type="text/javascript"/> -->
		
	</head>
	<body id="body" class="d-flex flex-column">
		
		<nav data-template="templates:include" data-template-path="templates/baudiMainNav.html"/>
		<main role="main" class="container mt-1" id="content">
			<!--<div />-->
		</main>
		<footer data-template="templates:include" data-template-path="templates/baudiMainFooter.html"/>
		
		<!-- Bootstrap core JavaScript
				 ================================================== -->
		<!-- Placed at the end of the document so the pages load faster -->
		<script src="$resources/lib/jquery/dist/jquery.min.js"/>
		<script src="$resources/lib/bootstrap/dist/js/bootstrap.bundle.min.js"/>
		
		<script src="$resources/js/incipit.js"/>
		<script src="$resources/js/baudiEvents.js"/>
		<script src="$resources/js/cookieHandler.js"/>
		
		
	</body>
</html>
